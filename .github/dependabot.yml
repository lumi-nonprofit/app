# Dependabot — version updates across all of Lumi's ecosystems (S10).
# JS app (RN/Expo), the Rust shared core, and the GitHub Actions used by CI.
#
# Policy (hardened after the PR #4 grouped-major bump broke CI — eslint 10 / jest 30 / RN 0.86):
#  - Security stays enabled (Dependabot is NOT disabled; the npm-audit visibility is the point).
#  - npm: minor + patch arrive in one group, for convenience; MAJORS do NOT: each major arrives
#    as its own reviewable PR you can decline.
#  - Expo-SDK-managed packages: Dependabot ignores them entirely (all update types). The Expo SDK
#    dictates their versions, and they move only through `expo install` on a deliberate Expo
#    upgrade, never independently — a standalone bump breaks the Expo/RN pairing and the verified
#    Nitro module ABI. (Their security fixes arrive through an Expo SDK upgrade.)
#  - eslint and jest/@types/jest: MAJORS ignored (peer-coupled — eslint-plugin-react-native-a11y
#    peers eslint <=8; jest-expo decides the jest major, which is 30 since SDK 58). Patches/minors
#    within the current major still flow. Dependabot does NOT ignore esbuild/uuid/drizzle-kit and
#    the other packages, so their advisories stay visible.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group only minor + patch; majors stay ungrouped -> individual, decline-able PRs.
      js-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo-SDK-managed — pinned to the SDK; only move through `expo install` on an SDK upgrade.
      # The Expo packages themselves are on this list too. PRs #48 to #57 moved 9 of them to SDK 58
      # while `expo` and `expo-router` stayed on SDK 56, and `npm ci` failed on main (ERESOLVE).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      # The SDK also pins these native modules (`expo/bundledNativeModules.json`). PR #46 showed
      # the risk: reanimated 4.7 and worklets 0.13 need React Native 0.86, so `npm ci` failed.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "@react-native-segmented-control/segmented-control"
      # Peer-coupled toolchain — majors break the build; patches/minors within the current major flow.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
