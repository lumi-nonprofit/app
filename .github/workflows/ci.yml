name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            server
      # --workspace covers every core member on the host runner, including the M1 crates added in
      # this milestone: lumi-vault (17 tests), lumi-store (9), lumi-ffi-cabi (4). The runner's C
      # compiler (gcc on ubuntu, clang on macos, MSVC on windows) builds rusqlite's bundled SQLite.
      - name: Build + test the shared core workspace (incl. lumi-vault / lumi-store / lumi-ffi-cabi)
        run: cargo test --manifest-path core/Cargo.toml --workspace --verbose
      - name: Build + test sync server (stub)
        run: cargo test --manifest-path server/Cargo.toml --workspace --verbose

  # Cross-compile guard: the shared core must stay buildable for a constrained (musl) target.
  # ONLY the musl-clean crates are covered:
  #   - lumi-core / lumi-crdt / lumi-sync-client / lumi-ffi / lumi-wasm: pure-Rust, truly toolchain-free.
  #   - lumi-vault: musl-GREEN but NOT toolchain-free — it cross-compiles to musl, yet its
  #     argon2/generic-array/libc build scripts invoke a HOST `cc` (present on the runner). It is a
  #     lib crate, so this is a compile-check (rlibs, no final link => no musl C toolchain needed).
  # EXCLUDED ON PURPOSE — do NOT re-add: lumi-store + lumi-ffi-cabi bundle SQLite, whose C sources
  # would need an x86_64-linux-musl C cross-compiler we deliberately don't depend on in CI. They are
  # host-only and are already fully tested by the `rust` job above. (Mirrors core/Cargo.toml's note.)
  musl:
    name: Rust musl cross-build (core portability guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Cross-build the musl-clean core crates (exclude the bundled-SQLite crates)
        run: >
          cargo build --manifest-path core/Cargo.toml
          --target x86_64-unknown-linux-musl
          --workspace --exclude lumi-store --exclude lumi-ffi-cabi --verbose

  # NOTE — deliberately NOT a job here: the Android native build (cargo-ndk cross-compile of
  # lumi-ffi-cabi -> .a per ABI, nitrogen codegen, gradle assembleRelease of the Nitro module + app).
  # It is a separate, heavier later lane that needs Android SDK + NDK runners. M1's CI proves the Rust
  # slice (host test + musl portability) and the JS/TS; the on-device Android build is verified
  # locally for now and gets its own workflow when the mobile CI lane is set up. Not silently omitted.

  js:
    name: JS app (RN/Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  tokens:
    name: Design tokens (Style Dictionary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
        working-directory: design
      - run: npm run build
        working-directory: design
      # src/theme/tokens.generated.ts is committed; it must match design/tokens (no drift)
      - run: git diff --exit-code -- src/theme/tokens.generated.ts

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate CycloneDX SBOM (npm + cargo via syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  # Dependency vulnerability scanning. REPORT-ONLY (continue-on-error): the npm step fails on any
  # advisory of level high or above, and the JS tree carries advisories that have no fix within the
  # pinned toolchain (checked 2026-10-18: 0 critical, 54 high, 21 moderate). The high ones are
  # `braces` (every published version is flagged; it reaches jest, metro and expo through
  # micromatch), `node-forge` (latest release flagged; @expo/cli) and `image-size` (metro 0.84 pins
  # 1.x). The moderate ones wait on Expo SDK, jest 30 and drizzle-kit majors. Transitive packages
  # that have a published fix are kept current in package-lock.json (docs/STATUS.md, finding 8).
  # `npm audit fix` cannot run here (ERESOLVE on react-native-reanimated vs React Native 0.85);
  # update the packages by name with `npm update`. Tighten to blocking once the Expo SDK upgrade
  # and the upstream fixes land.
  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (core)
        run: cargo audit --file core/Cargo.lock
      - name: cargo audit (server)
        run: |
          cargo generate-lockfile --manifest-path server/Cargo.toml
          cargo audit --file server/Cargo.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
