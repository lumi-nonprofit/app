# Vale configuration. Vale checks the Simplified Technical English (STE) rules of this project
# in every Markdown file and in the comments of every source file. See docs/writing-rules.md.
# Run it with `npm run lint:docs` (scripts/vale.sh gives Vale the file list from git).
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Lumi
# A quotation stays as the person wrote it: Vale does not check block quotes.
SkippedScopes = script, style, pre, figure, blockquote

[formats]
sh = py
cmake = py
gradle = java
mjs = js
cjs = js

[*]
BasedOnStyles = STE
STE.ProcedureSentenceLength = NO
STE.PassiveProcedure = NO
STE.ParagraphLength = NO

[*.md]
STE.ParagraphLength = YES

# Procedures: 20 words per sentence and the active voice are errors.
[{docs/pilot-release.md,docs/device-verification.md,docs/cz-crisis-data-checklist.md,CONTRIBUTING.md,modules/lumi-vault/RUNBOOK.md,spikes/rn-nitro/RUNBOOK.md,spikes/rn-nitro-app/RUNBOOK.md}]
STE.ProcedureSentenceLength = YES
STE.PassiveProcedure = YES

# Tests assert the visible Czech text, also inside regular expressions that Vale reads as
# comments. scripts/check-english-source.mjs checks the comments and the titles of the tests.
[test/**]
STE.NonEnglish = NO

# The legacy labels in the vocabulary module are Czech data for the migration of old entries.
[src/db/vocab.ts]
STE.NonEnglish = NO

# The 2 scripts define the Czech letters they look for.
[scripts/check-i18n.mjs]
STE.NonEnglish = NO

[scripts/check-english-source.mjs]
STE.NonEnglish = NO

# The crisis module and the Rust tests hold Czech data (line names, fixtures).
[core/lumi-core/src/crisis/*.rs]
STE.NonEnglish = NO

[core/*/tests/*.rs]
STE.NonEnglish = NO
