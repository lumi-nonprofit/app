  "I'm": I am
  "I've": I have
  "isn't": is not
  "it'll": it will
  "it's": it is
  "let's": let us
  "shouldn't": should not
  "that's": that is
  "there's": there is
  "they're": they are
  "they've": they have
  "wasn't": was not
  "we'll": we will
  "we're": we are
  "we've": we have
  "weren't": were not
