extends: substitution
message: "Use '%s' instead of '%s'. STE: one approved word for one meaning (project list, docs/writing-rules.md)."
link: https://www.asd-ste100.org/
level: error
ignorecase: true
swap:
  'utili[sz]e': use
  'utili[sz]es': uses
  commence: start
  commences: starts
  terminate: stop
  terminates: stops
  'prior to': before
  'subsequent to': after
  'in order to': to
  ensure: make sure
  ensures: makes sure
  attempt to: try to
  attempts to: tries to
  regarding: about
  assist: help
  assists: helps
  whilst: while
  however: but
  additional: more
  'in the event that': if
  'at this point in time': now
  'a number of': some
  'as well as': and
