[package]
name = "lumi-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "Lumi shared core: data model, validation, crisis recommender (dependency-free, on-device). Crypto + key hierarchy live in lumi-vault (ADR 0004); sync/merge in lumi-crdt + lumi-sync-client."

[dependencies]
# None. The crate is intentionally dependency-free: a small in-house JSON reader
# (src/crisis/json.rs) keeps the security-critical core lean and lets it build with
# no C toolchain. Ingestion walks the parsed value by hand (boundary validators,
# which mirror src/db/backup.ts asEntry/asMeasurement) so unknown input degrades.

[lints.rust]
unsafe_code = "forbid"
