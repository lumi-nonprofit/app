# Lumi at-rest crypto (ADR 0001 §3 / ADR 0004). Vetted pure-Rust RustCrypto only, so the
# crate stays musl-buildable and the security-critical logic has no hand-rolled crypto.
# Crypto-only: persistence is abstracted behind the `VaultStore` trait (rusqlite impl =
# lumi-store, next step). No SQLite / C-ABI / app wiring here.
[package]
name = "lumi-vault"
version = "0.0.0"
edition = "2021"
publish = false
description = "Lumi at-rest crypto: vault key hierarchy (Argon2id PIN-wrap), per-record content keys (XChaCha20-Poly1305), crypto-shredding. Persistence via a storage trait."

[dependencies]
argon2 = "0.5"                                       # RustCrypto pure-Rust Argon2id (NOT a C binding)
chacha20poly1305 = "0.11"                            # XChaCha20Poly1305 (24-byte nonce)
zeroize = { version = "1", features = ["alloc"] }    # no `derive` feature -> no proc-macro
getrandom = "0.4"                                    # OS CSPRNG

[lints.rust]
unsafe_code = "forbid"
